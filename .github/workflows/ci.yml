name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# A second push to the same branch makes the first run's answer irrelevant, so
# cancel it rather than pay for both. Never cancels on main: those runs are the
# record of what was green when it merged.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Reads `engines.node` and `packageManager` from the root manifest,
          # so the version lives in one place rather than being restated here.
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The test suites run in a real Chromium (vitest browser mode): the
      # things under test are a canvas, a pointer and a Web Worker, none of
      # which a DOM shim can stand in for honestly.
      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # Last, and not merely for speed: a build that fails after everything
      # else passed is a packaging problem, and reading it in that order says
      # so immediately.
      - run: pnpm build

      # What the tests cannot see: the shape of what actually gets published.
      # `publint` reads each manifest against the built files (an `exports` map
      # pointing at something that isn't there, a `types` condition in the
      # wrong order, ESM/CJS mismatches); `attw` resolves the .d.ts the way a
      # consumer's TypeScript will, under every module resolution mode. Both
      # failure modes survive a green test suite and a green build, and both
      # are only discoverable after publishing unless something checks here.
      - run: pnpm check:packages

  # `@klad/vue` declares `vue: ">=3.5 <4"`, so the day 3.6 leaves release
  # candidate every consumer's install resolves to it whether or not anything
  # here has ever run against it. This job is that run.
  #
  # Deliberately not required to pass: it tracks a moving target, and a broken
  # release candidate is Vue's news rather than a reason to block a merge here.
  # It is here to make the news arrive before a consumer's bug report does.
  vue-next:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Built against the pinned Vue, so what follows measures the release
      # candidate against the declarations this repository actually publishes.
      - run: pnpm build

      # Only the two packages that resolve Vue. This rewrites the lockfile in
      # the runner's checkout on purpose; nothing commits it back.
      - run: pnpm --filter @klad/vue --filter @klad/playground add -D vue@rc
      - run: pnpm --filter @klad/vue list vue

      - run: pnpm --filter @klad/vue test

      # The consumer fixture matters more here than the unit tests do: it is
      # what would notice Vue changing the shape of a component's public type,
      # which is a thing a passing runtime test cannot see.
      - run: pnpm --filter @klad/playground exec vue-tsc --noEmit -p tsconfig.consumer.json
